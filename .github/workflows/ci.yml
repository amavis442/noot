# Runs on every pull request to main and on every push to main. The job names
# ("format", "test (ubuntu-latest)", "test (windows-latest)") are the required
# status checks in the main ruleset: renaming a job means updating the ruleset.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted (run: make fmt):"
            echo "$unformatted"
            exit 1
          fi

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # noot runs on both; the e2e tests start real processes and touch
        # paths and git, which behave differently per OS.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # go vet + unit, integration and e2e tests.
      - name: make test
        run: make test

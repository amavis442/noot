# Runs on every pull request to main and on every push to main. The job names
# ("format", "test (ubuntu-latest)", "test (windows-latest)", "web") are the
# required status checks in the main ruleset: renaming a job means updating the
# ruleset. The "web" job builds and tests the React frontend in web/.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted (run: make fmt):"
            echo "$unformatted"
            exit 1
          fi

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # noot runs on both; the e2e tests start real processes and touch
        # paths and git, which behave differently per OS.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # go vet + unit, integration and e2e tests.
      - name: make test
        run: make test

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*  # newest Node.js LTS
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Vitest + Testing Library.
      - run: npm test
      # Type check + production build into web/dist.
      - run: npm run build
